<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="USPS Scan">
<link rel="icon" href="data:,">
<title>USPS Scan</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .guide { position: fixed; top: 50%; left: 50%; width: 85%; max-width: 420px; height: 140px;
    transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,.85); border-radius: 14px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
  .scanline { position: fixed; top: 50%; left: 50%; width: 85%; max-width: 420px; height: 2px;
    transform: translate(-50%, -50%); background: rgba(255,59,48,.9);
    animation: sweep 2.2s ease-in-out infinite; pointer-events: none; }
  @keyframes sweep {
    0%, 100% { transform: translate(-50%, -62px); }
    50% { transform: translate(-50%, 62px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scanline { animation: none; }
  }
  .bar { position: fixed; left: 0; right: 0; padding: 14px 16px; text-align: center;
    background: rgba(0,0,0,.6); z-index: 2; }
  .top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 15px; }
  .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .bottom form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 10px; border-radius: 8px; border: 0; }
  button { font-size: 16px; padding: 10px 16px; border-radius: 8px; border: 0; background: #0a84ff; color: #fff; }
  a { color: #7cc0ff; }
  #retry { display: none; margin-top: 8px; background: #0a84ff; }
  #photoBtn { background: #3a3a3c; width: 100%; margin-bottom: 8px; }
  .ver { font-size: 11px; opacity: .55; margin-top: 6px; text-align: right; }
  .hint { display: none; font-size: 13px; line-height: 1.5; opacity: .9; margin-top: 8px; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div class="guide"></div>
<div class="scanline"></div>
<div class="bar top">
  <div id="status">Starting camera…</div>
  <div id="debug" style="font-size:11px;opacity:.6;margin-top:4px"></div>
  <div id="hint" class="hint"></div>
  <button id="retry" type="button">Tap to start camera</button>
  <input id="photo" type="file" accept="image/*" capture="environment" style="display:none">
</div>
<div class="bar bottom">
  <button id="photoBtn" type="button">Scan from a photo</button>
  <form id="manual">
    <input id="num" inputmode="numeric" placeholder="Or type a tracking number" autocomplete="off">
    <button type="submit">Track</button>
  </form>
  <div class="ver">v6</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const debugEl = document.getElementById('debug');
  const hintEl = document.getElementById('hint');
  const retryBtn = document.getElementById('retry');
  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photo');
  const BASE = 'https://tools.usps.com/go/TrackConfirmAction?tLabels=';

  // Turn raw barcode text into a USPS tracking number
  function parseTracking(raw) {
    let s = String(raw).trim().toUpperCase();
    if (s.startsWith(']C1')) s = s.slice(3);                 // GS1 symbology identifier
    if (/^[A-Z]{2}\d{9}US$/.test(s)) return s;               // international S10
    const d = s.replace(/\D/g, '');
    if (d.length < 20) return null;
    if (d.startsWith('420') && d.length === 30) return d.slice(8);   // 420 + 5-digit ZIP
    if (d.startsWith('420') && d.length === 34) return d.slice(12);  // 420 + 9-digit ZIP
    if (d.length > 22) return d.slice(-22);
    return d;
  }

  function go(number) {
    const url = BASE + encodeURIComponent(number);
    statusEl.innerHTML = 'Opening ' + number + ' … <a href="' + url + '">tap if nothing happens</a>';
    if (navigator.vibrate) navigator.vibrate(100);
    window.location.href = url;
  }

  document.getElementById('manual').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('num').value.trim();
    const n = parseTracking(v) || v.replace(/\s/g, '').toUpperCase();
    if (n) go(n);
  });

  function makeReader() {
    const hints = new Map();
    // CODE_128 ONLY on purpose: the USPS tracking barcode is GS1-128.
    // USPS/Amazon labels are covered in Data Matrix routing codes, and
    // those decode much more easily than the long thin tracking barcode.
    // When they were allowed, the reader kept grabbing them first and
    // rejecting them as "not a USPS tracking number", so the real
    // tracking code never got a chance.
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return new ZXing.BrowserMultiFormatReader(hints, 150);
  }

  // On iPhone, live camera scanning only works in Safari (or the Home Screen
  // app). Other iOS browsers and in-app viewers block it, so offer a jump
  // straight to this same page in Safari.
  function safariLink() {
    try {
      const u = 'x-safari-' + location.href.split('#')[0];
      return '<a href="' + u + '">Open this page in Safari</a>';
    } catch (e) {
      return 'Open this page in Safari';
    }
  }

  function blockedCamera(err) {
    const name = err && err.name ? err.name : '';
    const ua = navigator.userAgent || '';
    const isiOS = /iPhone|iPad|iPod/i.test(ua);
    const isSafari = isiOS && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
    const noApi = !window.isSecureContext || !navigator.mediaDevices ||
      typeof navigator.mediaDevices.getUserMedia !== 'function';
    let hint = '';
    if (noApi) {
      statusEl.textContent = 'This browser can’t open the camera.';
      hint = isiOS
        ? safariLink() + ' — live scanning works there, and from the Home Screen icon. Or tap “Scan from a photo” to snap the label instead.'
        : 'Try opening this page in a full browser, or tap “Scan from a photo” to snap the label instead.';
    } else if (name === 'NotAllowedError' || name === 'SecurityError') {
      statusEl.textContent = 'Camera access is blocked for this page.';
      if (isiOS && !isSafari) {
        hint = safariLink() + ', add it to your Home Screen, and allow the camera there — live scanning only works in Safari on iPhone. Or tap “Scan from a photo” below.';
      } else {
        hint = 'Tap “Tap to start camera” and choose Allow. If you blocked it earlier: in Safari tap the “AA” button in the address bar → Website Settings → Camera → Allow, then reload this page. Or tap “Scan from a photo”.';
      }
    } else if (name === 'NotReadableError' || name === 'AbortError') {
      statusEl.textContent = 'The camera couldn’t start.';
      hint = 'Another app may be using it — close that app, then tap “Tap to start camera”. Or tap “Scan from a photo”.';
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      statusEl.textContent = 'No usable camera was found.';
      hint = 'Tap “Scan from a photo” to snap the label instead, or type the tracking number below.';
    } else {
      statusEl.textContent = 'Camera error: ' + (err && err.message ? err.message : err);
      hint = 'Tap “Scan from a photo” to snap the label instead, or type the tracking number below.';
    }
    if (hint) { hintEl.innerHTML = hint; hintEl.style.display = 'block'; }
    retryBtn.style.display = 'inline-block';
  }

  // From strictest to loosest: if the camera rejects one spec, fall back
  // instead of giving up (the old single 1080p request failed outright on
  // cameras that could still scan fine at a lower resolution).
  const CONSTRAINT_SETS = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } },
    { video: { facingMode: { ideal: 'environment' } } },
    { video: true }
  ];

  async function start() {
    retryBtn.style.display = 'none';
    hintEl.style.display = 'none';
    statusEl.textContent = 'Starting camera…';
    if (typeof ZXing === 'undefined') {
      statusEl.textContent = 'Scanner library failed to load — check your connection, then tap retry.';
      retryBtn.style.display = 'inline-block';
      photoBtn.style.display = 'inline-block';
      return;
    }
    if (!window.isSecureContext || !navigator.mediaDevices ||
        typeof navigator.mediaDevices.getUserMedia !== 'function') {
      blockedCamera(null);
      return;
    }
    // Native barcode detection (Apple's Vision framework under the hood)
    // is dramatically better at long Code 128 barcodes than the JS library.
    // Use it when the browser offers it; fall back to ZXing otherwise.
    if (!window.__noNative && 'BarcodeDetector' in window) {
      try {
        const formats = await window.BarcodeDetector.getSupportedFormats();
        if (formats.indexOf('code_128') !== -1) {
          const stream = await navigator.mediaDevices.getUserMedia(
            { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
          const video = document.getElementById('video');
          video.srcObject = stream;
          await video.play();
          const detector = new window.BarcodeDetector({ formats: ['code_128'] });
          statusEl.textContent = 'Point at a USPS barcode';
          debugEl.textContent = 'Scanner: built-in';
          let ndone = false;
          let errs = 0;
          const tick = async () => {
            if (ndone) return;
            try {
              const codes = await detector.detect(video);
              errs = 0;
              for (const code of codes) {
                const raw = code.rawValue || '';
                const n = parseTracking(raw);
                if (n) {
                  ndone = true;
                  stream.getTracks().forEach(t => t.stop());
                  go(n);
                  return;
                }
                debugEl.textContent = 'Built-in scanner read: ' + raw;
              }
            } catch (e) {
              errs++;
              if (errs >= 15) {
                // The built-in detector exists but cannot actually run
                // here - stop silently looping and hand over to ZXing.
                ndone = true;
                try { stream.getTracks().forEach(t => t.stop()); } catch (e2) {}
                window.__noNative = true;
                debugEl.textContent = 'Built-in scanner could not run - switching to web scanner';
                start();
                return;
              }
            }
            if (!ndone) setTimeout(tick, 250);
          };
          tick();
          return;
        }
      } catch (e) { /* native path failed - ZXing below gets its turn */ }
    }
    // Pro engine: zxing-cpp compiled to WebAssembly - the same decoder
    // family that reads these labels instantly from still photos - fed
    // live camera frames on a timer. It localizes every code in the
    // frame (the GS1-128 AND the hardier Data Matrix copy of the same
    // payload these labels carry) and we keep the first one that parses
    // as a tracking number.
    if (!window.__noWasm && typeof ZXingWASM !== 'undefined') {
      let wstream = null;
      try {
        debugEl.textContent = 'Loading pro scanner...';
        await ZXingWASM.prepareZXingModule({
            overrides: { locateFile: (path) => path.endsWith('.wasm')
              ? 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm'
              : path },
            fireImmediately: true
          });
        const ladder = [
          { video: { facingMode: { ideal: 'environment' }, width: { min: 1920 }, height: { min: 1080 } }, audio: false },
          { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
          { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
          { video: true, audio: false }
        ];
        let werr = null;
        for (const c of ladder) {
          try { wstream = await navigator.mediaDevices.getUserMedia(c); break; }
          catch (e) { werr = e; if (e && e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError') throw e; }
        }
        if (!wstream) throw werr || new Error('no camera');
        const video = document.getElementById('video');
        video.srcObject = wstream;
        await video.play();
        statusEl.textContent = 'Point at a USPS barcode';
        debugEl.textContent = 'Scanner: pro';
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let wdone = false, werrs = 0;
        const wtick = async () => {
          if (wdone) return;
          try {
            if (video.readyState >= 2 && video.videoWidth) {
              const w = Math.min(video.videoWidth, 1920);
              const h = Math.round(video.videoHeight * (w / video.videoWidth));
              if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
              ctx.drawImage(video, 0, 0, w, h);
              const results = await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, w, h), { maxNumberOfSymbols: 6, tryHarder: true });
              werrs = 0;
              for (const r of results) {
                const n = parseTracking(r.text || '');
                if (n) {
                  wdone = true;
                  wstream.getTracks().forEach(t => t.stop());
                  go(n);
                  return;
                }
                if (r.text) debugEl.textContent = 'Pro scanner read: ' + r.text;
              }
            }
          } catch (e) {
            werrs++;
            if (werrs >= 20) {
              wdone = true;
              try { wstream.getTracks().forEach(t => t.stop()); } catch (e2) {}
              window.__noWasm = true;
              debugEl.textContent = 'Pro scanner could not run - switching to web scanner';
              start();
              return;
            }
          }
          if (!wdone) setTimeout(wtick, 300);
        };
        wtick();
        return;
      } catch (e) {
        if (wstream) try { wstream.getTracks().forEach(t => t.stop()); } catch (e2) {}
        window.__noWasm = true;
        // fall through to the ZXing-JS path below
      }
    }
    const reader = makeReader();
    let done = false;
    let lastReject = 0;
    let lastErr = null;
    const onResult = (result) => {
      if (!result || done) return;
      const raw = result.getText();
      const n = parseTracking(raw);
      if (n) { done = true; try { reader.reset(); } catch (e) {} go(n); }
      else {
        debugEl.textContent = 'Web scanner read: ' + raw;
        const now = Date.now();
        if (now - lastReject > 3000) {
          lastReject = now;
          statusEl.textContent = 'That was not the tracking barcode. Keep the big USPS TRACKING barcode in the box.';
        }
      }
    };
    // Prefer the main rear camera by name: on multi-camera phones the
    // generic constraint path can end up on an ultra-wide or front
    // camera whose stream is too soft for a long thin barcode.
    try {
      const devices = await reader.listVideoInputDevices();
      const back = devices.find(d => /back/i.test(d.label) && !/ultra|tele/i.test(d.label))
        || devices.find(d => /back/i.test(d.label))
        || devices[devices.length - 1];
      if (back) {
        await reader.decodeFromVideoDevice(back.deviceId, document.getElementById('video'), onResult);
        debugEl.textContent = 'Scanner: web library';
        statusEl.textContent = 'Point at a USPS barcode';
        return;
      }
    } catch (err) {
      lastErr = err;
      try { reader.reset(); } catch (e) {}
    }
    for (let i = 0; i < CONSTRAINT_SETS.length; i++) {
      try {
        await reader.decodeFromConstraints(CONSTRAINT_SETS[i], document.getElementById('video'), onResult);
        debugEl.textContent = 'Scanner: web library';
        statusEl.textContent = 'Point at a USPS barcode';
        return;
      } catch (err) {
        lastErr = err;
        try { reader.reset(); } catch (e) {}
        const name = err && err.name ? err.name : '';
        // Only a spec problem is worth retrying looser; a permission block
        // or busy camera will fail the same way at every setting.
        if (name !== 'OverconstrainedError' && name !== 'NotFoundError') break;
      }
    }
    blockedCamera(lastErr);
  }

  retryBtn.addEventListener('click', start);


  // Pull a USPS tracking number out of OCR text (the printed digits under
  // the barcode). Returns { go } for a confident read, or { candidate }
  // with the raw digits when it is close but not trustworthy enough to
  // open automatically - the caller pre-fills the manual box with it.
  function extractTrackingFromText(text) {
    const groups = String(text).match(/\d[\d ]{16,}\d/g) || [];
    let best = '';
    // OCR-only confidence rule: auto-open only a full-length read
    // (22 digits, or an international S10 code). Anything shorter is
    // probably a misread digit or two - show it for a quick check
    // instead of opening a wrong or invalid number.
    const confident = (n) => !!n && (/^\d{22}$/.test(n) || /^[A-Z]{2}\d{9}US$/.test(n));
    for (const g of groups) {
      const digits = g.replace(/\D/g, '');
      const n = parseTracking(digits);
      if (confident(n)) return { go: n };
      if (digits.length > best.length) best = digits;
    }
    const all = String(text).replace(/\D/g, '');
    const n2 = parseTracking(all);
    if (confident(n2) && all.length <= 34) return { go: n2 };
    if (best.length >= 18) return { candidate: best };
    if (all.length >= 18 && all.length <= 36) return { candidate: all };
    return {};
  }

  // OCR one image (the printed number line) with Tesseract, digits only.
  // The photo is binarized first, which printed-label OCR needs badly.
  async function ocrNumber(img) {
    const maxW = 1600;
    const scale = Math.min(2, maxW / img.naturalWidth) || 1;
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height);
    for (let i = 0; i < d.data.length; i += 4) {
      const lum = 0.299 * d.data[i] + 0.587 * d.data[i + 1] + 0.114 * d.data[i + 2];
      const v = lum > 150 ? 255 : 0;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    }
    ctx.putImageData(d, 0, 0);
    const worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789 ',
      tessedit_pageseg_mode: '6'
    });
    try {
      const { data } = await worker.recognize(c);
      return data.text || '';
    } finally {
      await worker.terminate();
    }
  }

  // Photo fallback: works in browsers that block the live camera. Snap (or
  // pick) a picture of the label and decode the barcode from the still image.
  photoBtn.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', () => {
    const file = photoInput.files && photoInput.files[0];
    photoInput.value = '';
    if (!file) return;
    if (typeof ZXing === 'undefined') {
      statusEl.textContent = 'Scanner library failed to load — check your connection.';
      return;
    }
    statusEl.textContent = 'Reading photo…';
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      // 1) The barcode itself, from the full-resolution still - a still
      // photo carries far more detail than a live video frame. The pro
      // (zxing-cpp) decoder gets the first try, ZXing-JS the second.
      try {
        if (typeof ZXingWASM !== 'undefined') {
          await ZXingWASM.prepareZXingModule({
            overrides: { locateFile: (path) => path.endsWith('.wasm')
              ? 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm'
              : path },
            fireImmediately: true
          });
          const pc = document.createElement('canvas');
          const pw = Math.min(img.naturalWidth, 2000);
          pc.width = pw;
          pc.height = Math.round(img.naturalHeight * pw / img.naturalWidth);
          const pctx = pc.getContext('2d');
          pctx.drawImage(img, 0, 0, pc.width, pc.height);
          const pres = await ZXingWASM.readBarcodes(pctx.getImageData(0, 0, pc.width, pc.height), { maxNumberOfSymbols: 6, tryHarder: true });
          for (const r of pres) {
            const n = parseTracking(r.text || '');
            if (n) { go(n); URL.revokeObjectURL(url); return; }
          }
        }
      } catch (e) { /* fall through to ZXing-JS */ }
      try {
        const result = await makeReader().decodeFromImageElement(img);
        const n = parseTracking(result.getText());
        if (n) { go(n); URL.revokeObjectURL(url); return; }
      } catch (e) { /* fall through to reading the printed number */ }
      // 2) Read the printed tracking number under the barcode (OCR).
      if (typeof Tesseract === 'undefined') {
        statusEl.textContent = 'No barcode found in that photo. Fill the frame with the barcode, keep it flat and in good light, and try again.';
        URL.revokeObjectURL(url);
        return;
      }
      statusEl.textContent = 'No barcode read. Reading the printed number instead… (first time can take a few seconds)';
      try {
        const text = await ocrNumber(img);
        const found = extractTrackingFromText(text);
        if (found.go) { go(found.go); URL.revokeObjectURL(url); return; }
        if (found.candidate) {
          const numEl = document.getElementById('num');
          numEl.value = found.candidate;
          statusEl.textContent = 'I read a number like the one filled in below. Check it against the label, fix any wrong digit, then tap Track.';
          numEl.focus();
        } else {
          statusEl.textContent = 'Could not read that photo. Snap just the printed tracking number, filling the frame, flat and in good light.';
        }
      } catch (e) {
        statusEl.textContent = 'Could not read that photo. Try again, closer and in good light.';
      }
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      statusEl.textContent = 'Could not read that photo.';
    };
    img.src = url;
  });

  // Restart scanning if the page is restored from the back/forward cache
  window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
  start();
</script>
</body>
</html>
