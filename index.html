<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Package Scanner Pro">
<link rel="icon" href="data:,">
<title>Package Scanner Pro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .guide { position: fixed; top: 50%; left: 50%; width: 85%; max-width: 420px; height: 140px;
    transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,.85); border-radius: 14px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
  .scanline { position: fixed; top: 50%; left: 50%; width: 85%; max-width: 420px; height: 2px;
    transform: translate(-50%, -50%); background: rgba(255,59,48,.9);
    animation: sweep 2.2s ease-in-out infinite; pointer-events: none; }
  @keyframes sweep {
    0%, 100% { transform: translate(-50%, -62px); }
    50% { transform: translate(-50%, 62px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scanline { animation: none; }
  }
  .bar { position: fixed; left: 0; right: 0; padding: 14px 16px; text-align: center;
    background: rgba(0,0,0,.6); z-index: 2; }
  .top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 15px; }
  .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .bottom form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 10px; border-radius: 8px; border: 0; }
  button { font-size: 16px; padding: 10px 16px; border-radius: 8px; border: 0; background: #0a84ff; color: #fff; }
  a { color: #7cc0ff; }
  #retry { display: none; margin-top: 8px; background: #0a84ff; }
  #photoBtn { background: #3a3a3c; width: 100%; margin-bottom: 8px; }
  .ver { font-size: 11px; opacity: .55; margin-top: 6px; text-align: right; }
  .hint { display: none; font-size: 13px; line-height: 1.5; opacity: .9; margin-top: 8px; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div class="guide"></div>
<div class="scanline"></div>
<div class="bar top">
  <div id="status">Starting camera…</div>
  <div id="debug" style="font-size:11px;opacity:.6;margin-top:4px"></div>
  <div id="hint" class="hint"></div>
  <button id="retry" type="button">Tap to start camera</button>
  <input id="photo" type="file" accept="image/*" capture="environment" style="display:none">
</div>
<div class="bar bottom">
  <button id="photoBtn" type="button">Scan from a photo</button>
  <form id="manual">
    <input id="num" placeholder="Or type a tracking number" autocomplete="off" autocapitalize="characters">
    <button type="submit">Track</button>
  </form>
  <div class="ver">v11</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const debugEl = document.getElementById('debug');
  const hintEl = document.getElementById('hint');
  const retryBtn = document.getElementById('retry');
  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photo');
  const BASE = 'https://tools.usps.com/go/TrackConfirmAction?tLabels=';

  // USPS PIC check digit (Mod 10): reading the payload right to left
  // from the check digit, every second digit counts x3. Verified
  // against real 22- and 26-digit PICs from Thomas's labels.
  function validPic(d) {
    if (!/^\d{22}$/.test(d) && !/^\d{26}$/.test(d)) return false;
    let tot = 0;
    for (let i = 0; i < d.length - 1; i++) {
      const digit = d.charCodeAt(d.length - 2 - i) - 48;
      tot += (i % 2 === 0) ? digit * 3 : digit;
    }
    return (10 - (tot % 10)) % 10 === (d.charCodeAt(d.length - 1) - 48);
  }

  // Turn raw barcode text into a USPS tracking number
  function parseTracking(raw) {
    let s = String(raw).trim().toUpperCase();
    if (s.startsWith(']C1')) s = s.slice(3);                 // GS1 symbology identifier
    if (/^[A-Z]{2}\d{9}US$/.test(s)) return s;               // international S10
    const d = s.replace(/\D/g, '');
    if (d.length < 20) return null;
    if (d.startsWith('420')) {
      // After the 420 AI comes a 5- or 9-digit ZIP, then the PIC
      // (22 or 26 digits). A 34-digit string is ambiguous between
      // ZIP5+26-digit PIC (UPS Ground Saver labels) and ZIP+4+22-digit
      // PIC - the PIC check digit tells them apart.
      const rest = d.slice(3);
      for (const off of [5, 9]) {
        const pic = rest.slice(off);
        if ((pic.length === 22 || pic.length === 26) && validPic(pic)) return pic;
      }
      if (d.length === 30) return d.slice(8);   // 420 + 5-digit ZIP
      if (d.length === 34) return d.slice(12);  // 420 + 9-digit ZIP
      if (d.length > 22) return d.slice(-22);
      return d;
    }
    if (d.length === 26 && /^9[1-5]/.test(d)) return d;      // bare 26-digit PIC
    if (d.length > 22) return d.slice(-22);
    return d;
  }

  function fedexResult(num) {
    return { carrier: 'FedEx', number: num, url: 'https://www.fedex.com/fedextrack/?trknbr=' + num };
  }

  // Decide which carrier a raw barcode (or typed number) belongs to and
  // build its tracking link. Returns null when nothing fits.
  function classify(raw) {
    if (raw == null) return null;
    const text = String(raw).toUpperCase();
    // UPS numbers (1Z + 16) are unmistakable, in Code 128 and in the
    // round MaxiCode payload alike.
    const ups = text.match(/1Z[0-9A-Z]{16}/);
    if (ups) return { carrier: 'UPS', number: ups[0], url: 'https://www.ups.com/track?tracknum=' + ups[0] };
    const digits = text.replace(/\D/g, '');
    // FedEx Ground GS1 string: (420) + destination ZIP + 15-digit tracking.
    // Must be checked before the USPS rules, which would otherwise claim
    // the combined digit string.
    const g420 = digits.match(/^420\d{5}(\d{15})$/);
    if (g420) return fedexResult(g420[1]);
    // FedEx Ground sortation barcode: 34 digits starting 96, tracking
    // number in the last 12 digits (positions 23-34, after a '00'
    // separator at 21-22). Confirmed against a real label on
    // 2026-10-28: raw 9622013700003828508600528879924920 decodes to
    // TRK# 5288 7992 4920, matching the number printed on the label.
    if (/^96\d{32}$/.test(digits) && digits.slice(20, 22) === '00') return fedexResult(digits.slice(22));
    // FedEx 22-digit numbers starting 98 are NOT USPS numbers (USPS PICs
    // start 92-95) - v7 sent one to USPS and got "Tracking Not Available".
    if (/^98\d{20}$/.test(digits)) return fedexResult(digits);
    // FedEx Ground Economy (SmartPost): 20 digits starting 9261. Its
    // 22-digit cousin (92 + this) IS a USPS-deliverable PIC and stays
    // with the USPS rules below.
    if (/^9261\d{16}$/.test(digits)) return fedexResult(digits);
    // FedEx long sortation barcodes (start 96 or 98, 28+ digits) carry
    // the tracking number in a fixed position we have not confirmed
    // against a real label yet. Never slice them into a fake USPS
    // number - report the format as not covered instead.
    if (digits.length >= 28 && /^9[68]/.test(digits)) return { carrier: 'FedEx', pending: true };
    // A short string starting 420 is a destination-ZIP routing barcode
    // (420 + ZIP or ZIP+4), printed on UPS and USPS labels alike - it is
    // never a FedEx number, even though 12 digits matches the Express
    // shape. (Thomas's Ground Saver label proved this the hard way.)
    if (digits.startsWith('420') && digits.length <= 16) return null;
    // FedEx bare numbers: 12 digits (Express) or 15 digits (Ground).
    if (/^\d{12}$/.test(digits) || /^\d{15}$/.test(digits)) return fedexResult(digits);
    // USPS: GS1-128 package codes, 20-22 digit numbers, S10 international.
    const usps = parseTracking(text);
    if (usps) return { carrier: 'USPS', number: usps, url: BASE + encodeURIComponent(usps) };
    return null;
  }

  // One entry point for every engine's raw read: returns true when a
  // tracking page was opened, 'pending' for a recognized-but-uncovered
  // FedEx format, false otherwise.
  function handleRaw(raw, fmt) {
    if (isProductFormat(fmt)) return false;
    const res = classify(raw);
    if (res && res.url) { goResult(res); return true; }
    if (res && res.pending) {
      statusEl.textContent = 'That is a FedEx label, but this barcode format is not covered yet.';
      return 'pending';
    }
    return false;
  }

  function goResult(res) {
    statusEl.innerHTML = 'Opening ' + res.carrier + ' ' + res.number + ' … <a href="' + res.url + '">tap if nothing happens</a>';
    if (navigator.vibrate) navigator.vibrate(100);
    window.location.href = res.url;
  }

  // Retail product codes are not tracking numbers - never route them.
  function isProductFormat(fmt) {
    return /UPC|EAN|ISBN/i.test(String(fmt || ''));
  }

  document.getElementById('manual').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('num').value.trim();
    const res = classify(v);
    if (res && res.url) goResult(res);
    else if (res && res.pending) statusEl.textContent = 'That is a FedEx barcode number, but this format is not covered yet.';
    else if (v) statusEl.textContent = 'That does not look like a USPS, UPS, or FedEx tracking number. Check it and try again.';
  });

  function makeReader() {
    const hints = new Map();
    // The pro WASM engine does the heavy lifting; this ZXing reader is
    // the fallback for photos and the last-resort live path. Every decode
    // is passed through classify(), so easy-to-read noise (the Data
    // Matrix routing codes on USPS/Amazon labels) is simply ignored
    // while scanning continues - that was not true of the original
    // design, which accepted the first decode it got.
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.PDF_417,
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.QR_CODE
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return new ZXing.BrowserMultiFormatReader(hints, 150);
  }

  // On iPhone, live camera scanning only works in Safari (or the Home Screen
  // app). Other iOS browsers and in-app viewers block it, so offer a jump
  // straight to this same page in Safari.
  function safariLink() {
    try {
      const u = 'x-safari-' + location.href.split('#')[0];
      return '<a href="' + u + '">Open this page in Safari</a>';
    } catch (e) {
      return 'Open this page in Safari';
    }
  }

  function blockedCamera(err) {
    const name = err && err.name ? err.name : '';
    const ua = navigator.userAgent || '';
    const isiOS = /iPhone|iPad|iPod/i.test(ua);
    const isSafari = isiOS && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
    const noApi = !window.isSecureContext || !navigator.mediaDevices ||
      typeof navigator.mediaDevices.getUserMedia !== 'function';
    let hint = '';
    if (noApi) {
      statusEl.textContent = 'This browser can’t open the camera.';
      hint = isiOS
        ? safariLink() + ' — live scanning works there, and from the Home Screen icon. Or tap “Scan from a photo” to snap the label instead.'
        : 'Try opening this page in a full browser, or tap “Scan from a photo” to snap the label instead.';
    } else if (name === 'NotAllowedError' || name === 'SecurityError') {
      statusEl.textContent = 'Camera access is blocked for this page.';
      if (isiOS && !isSafari) {
        hint = safariLink() + ', add it to your Home Screen, and allow the camera there — live scanning only works in Safari on iPhone. Or tap “Scan from a photo” below.';
      } else {
        hint = 'Tap “Tap to start camera” and choose Allow. If you blocked it earlier: in Safari tap the “AA” button in the address bar → Website Settings → Camera → Allow, then reload this page. Or tap “Scan from a photo”.';
      }
    } else if (name === 'NotReadableError' || name === 'AbortError') {
      statusEl.textContent = 'The camera couldn’t start.';
      hint = 'Another app may be using it — close that app, then tap “Tap to start camera”. Or tap “Scan from a photo”.';
    } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      statusEl.textContent = 'No usable camera was found.';
      hint = 'Tap “Scan from a photo” to snap the label instead, or type the tracking number below.';
    } else {
      statusEl.textContent = 'Camera error: ' + (err && err.message ? err.message : err);
      hint = 'Tap “Scan from a photo” to snap the label instead, or type the tracking number below.';
    }
    if (hint) { hintEl.innerHTML = hint; hintEl.style.display = 'block'; }
    retryBtn.style.display = 'inline-block';
  }

  // From strictest to loosest: if the camera rejects one spec, fall back
  // instead of giving up (the old single 1080p request failed outright on
  // cameras that could still scan fine at a lower resolution).
  const CONSTRAINT_SETS = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } },
    { video: { facingMode: { ideal: 'environment' } } },
    { video: true }
  ];

  async function start() {
    retryBtn.style.display = 'none';
    hintEl.style.display = 'none';
    statusEl.textContent = 'Starting camera…';
    if (typeof ZXing === 'undefined') {
      statusEl.textContent = 'Scanner library failed to load — check your connection, then tap retry.';
      retryBtn.style.display = 'inline-block';
      photoBtn.style.display = 'inline-block';
      return;
    }
    if (!window.isSecureContext || !navigator.mediaDevices ||
        typeof navigator.mediaDevices.getUserMedia !== 'function') {
      blockedCamera(null);
      return;
    }
    // Native barcode detection (Apple's Vision framework under the hood)
    // is dramatically better at long Code 128 barcodes than the JS library.
    // Use it when the browser offers it; fall back to ZXing otherwise.
    if (!window.__noNative && 'BarcodeDetector' in window) {
      try {
        const formats = await window.BarcodeDetector.getSupportedFormats();
        const wanted = ['code_128', 'pdf417', 'data_matrix', 'qr_code'];
        const usable = wanted.filter(f => formats.indexOf(f) !== -1);
        if (usable.length) {
          const stream = await navigator.mediaDevices.getUserMedia(
            { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
          const video = document.getElementById('video');
          video.srcObject = stream;
          await video.play();
          const detector = new window.BarcodeDetector({ formats: usable });
          statusEl.textContent = 'Point at a package barcode';
          debugEl.textContent = 'Scanner: built-in';
          let ndone = false;
          let errs = 0;
          const tick = async () => {
            if (ndone) return;
            try {
              const codes = await detector.detect(video);
              errs = 0;
              for (const code of codes) {
                const raw = code.rawValue || '';
                const hr = handleRaw(raw, code.format);
                if (hr === true) {
                  ndone = true;
                  stream.getTracks().forEach(t => t.stop());
                  return;
                }
                if (hr === false) debugEl.textContent = 'Built-in scanner read: ' + raw;
              }
            } catch (e) {
              errs++;
              if (errs >= 15) {
                // The built-in detector exists but cannot actually run
                // here - stop silently looping and hand over to ZXing.
                ndone = true;
                try { stream.getTracks().forEach(t => t.stop()); } catch (e2) {}
                window.__noNative = true;
                debugEl.textContent = 'Built-in scanner could not run - switching to web scanner';
                start();
                return;
              }
            }
            if (!ndone) setTimeout(tick, 250);
          };
          tick();
          return;
        }
      } catch (e) { /* native path failed - ZXing below gets its turn */ }
    }
    // Pro engine: zxing-cpp compiled to WebAssembly - the same decoder
    // family that reads these labels instantly from still photos - fed
    // live camera frames on a timer. It localizes every code in the
    // frame (the GS1-128 AND the hardier Data Matrix copy of the same
    // payload these labels carry) and we keep the first one that parses
    // as a tracking number.
    if (!window.__noWasm && typeof ZXingWASM !== 'undefined') {
      let wstream = null;
      try {
        debugEl.textContent = 'Loading pro scanner...';
        await ZXingWASM.prepareZXingModule({
            overrides: { locateFile: (path) => path.endsWith('.wasm')
              ? 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm'
              : path },
            fireImmediately: true
          });
        const ladder = [
          { video: { facingMode: { ideal: 'environment' }, width: { min: 1920 }, height: { min: 1080 } }, audio: false },
          { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
          { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
          { video: true, audio: false }
        ];
        let werr = null;
        for (const c of ladder) {
          try { wstream = await navigator.mediaDevices.getUserMedia(c); break; }
          catch (e) { werr = e; if (e && e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError') throw e; }
        }
        if (!wstream) throw werr || new Error('no camera');
        const video = document.getElementById('video');
        video.srcObject = wstream;
        await video.play();
        statusEl.textContent = 'Point at a package barcode';
        debugEl.textContent = 'Scanner: pro';
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let wdone = false, werrs = 0;
        const wtick = async () => {
          if (wdone) return;
          try {
            if (video.readyState >= 2 && video.videoWidth) {
              const w = Math.min(video.videoWidth, 1920);
              const h = Math.round(video.videoHeight * (w / video.videoWidth));
              if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
              ctx.drawImage(video, 0, 0, w, h);
              const results = await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, w, h), { maxNumberOfSymbols: 6, tryHarder: true });
              werrs = 0;
              for (const r of results) {
                const hr = handleRaw(r.text || '', r.format);
                if (hr === true) {
                  wdone = true;
                  wstream.getTracks().forEach(t => t.stop());
                  return;
                }
                if (hr === false && r.text) debugEl.textContent = 'Pro scanner read: ' + r.text;
              }
            }
          } catch (e) {
            werrs++;
            if (werrs >= 20) {
              wdone = true;
              try { wstream.getTracks().forEach(t => t.stop()); } catch (e2) {}
              window.__noWasm = true;
              debugEl.textContent = 'Pro scanner could not run - switching to web scanner';
              start();
              return;
            }
          }
          if (!wdone) setTimeout(wtick, 300);
        };
        wtick();
        return;
      } catch (e) {
        if (wstream) try { wstream.getTracks().forEach(t => t.stop()); } catch (e2) {}
        window.__noWasm = true;
        // fall through to the ZXing-JS path below
      }
    }
    const reader = makeReader();
    let done = false;
    let lastReject = 0;
    let lastErr = null;
    const onResult = (result) => {
      if (!result || done) return;
      const raw = result.getText();
      let fmtName = '';
      try { fmtName = String(result.getBarcodeFormat()); } catch (e) {}
      const hr = handleRaw(raw, fmtName);
      if (hr === true) { done = true; try { reader.reset(); } catch (e) {} }
      else if (hr === false) {
        debugEl.textContent = 'Web scanner read: ' + raw;
        const now = Date.now();
        if (now - lastReject > 3000) {
          lastReject = now;
          statusEl.textContent = 'That was not a tracking barcode. Keep the big tracking barcode in the box.';
        }
      }
    };
    // Prefer the main rear camera by name: on multi-camera phones the
    // generic constraint path can end up on an ultra-wide or front
    // camera whose stream is too soft for a long thin barcode.
    try {
      const devices = await reader.listVideoInputDevices();
      const back = devices.find(d => /back/i.test(d.label) && !/ultra|tele/i.test(d.label))
        || devices.find(d => /back/i.test(d.label))
        || devices[devices.length - 1];
      if (back) {
        await reader.decodeFromVideoDevice(back.deviceId, document.getElementById('video'), onResult);
        debugEl.textContent = 'Scanner: web library';
        statusEl.textContent = 'Point at a package barcode';
        return;
      }
    } catch (err) {
      lastErr = err;
      try { reader.reset(); } catch (e) {}
    }
    for (let i = 0; i < CONSTRAINT_SETS.length; i++) {
      try {
        await reader.decodeFromConstraints(CONSTRAINT_SETS[i], document.getElementById('video'), onResult);
        debugEl.textContent = 'Scanner: web library';
        statusEl.textContent = 'Point at a package barcode';
        return;
      } catch (err) {
        lastErr = err;
        try { reader.reset(); } catch (e) {}
        const name = err && err.name ? err.name : '';
        // Only a spec problem is worth retrying looser; a permission block
        // or busy camera will fail the same way at every setting.
        if (name !== 'OverconstrainedError' && name !== 'NotFoundError') break;
      }
    }
    blockedCamera(lastErr);
  }

  retryBtn.addEventListener('click', start);


  // Pull a USPS tracking number out of OCR text (the printed digits under
  // the barcode). Returns { go } for a confident read, or { candidate }
  // with the raw digits when it is close but not trustworthy enough to
  // open automatically - the caller pre-fills the manual box with it.
  function extractTrackingFromText(text) {
    const direct = classify(text);
    if (direct && direct.pending) return {};
    if (direct && direct.carrier !== 'USPS') return { goRes: direct };
    // A USPS hit straight from classify() is only trusted at full length:
    // OCR dropping a digit yields a 20-21 digit string that parseTracking
    // would otherwise happily accept, and that must stay a check-first
    // candidate, not an auto-open.
    if (direct && (/^\d{22}$/.test(direct.number) || /^\d{26}$/.test(direct.number) || /^[A-Z]{2}\d{9}US$/.test(direct.number))) return { goRes: direct };
    const groups = String(text).match(/\d[\d ]{10,}\d/g) || [];
    let best = '';
    // Confident auto-open: an exact-length carrier number (USPS 22,
    // FedEx 12/15). Anything close-but-off becomes a candidate to check.
    const tryDigits = (digits) => {
      const c = classify(digits);
      if (c && c.carrier === 'FedEx') return c;
      const n = parseTracking(digits);
      if (n && /^\d{22}$/.test(n)) return { carrier: 'USPS', number: n, url: BASE + encodeURIComponent(n) };
      if (n && /^\d{26}$/.test(n)) return { carrier: 'USPS', number: n, url: BASE + encodeURIComponent(n) };
      if (n && /^[A-Z]{2}\d{9}US$/.test(n)) return { carrier: 'USPS', number: n, url: BASE + encodeURIComponent(n) };
      return null;
    };
    for (const g of groups) {
      const digits = g.replace(/\D/g, '');
      const r = tryDigits(digits);
      if (r) return { goRes: r };
      if (digits.length > best.length) best = digits;
    }
    const all = String(text).replace(/\D/g, '');
    const r2 = tryDigits(all);
    if (r2 && all.length <= 34) return { goRes: r2 };
    if (best.length >= 11) return { candidate: best };
    if (all.length >= 11 && all.length <= 36) return { candidate: all };
    return {};
  }

  // OCR one image (the printed number line) with Tesseract, digits only.
  // The photo is binarized first, which printed-label OCR needs badly.
  async function ocrNumber(img, whitelist) {
    const maxW = 1600;
    const scale = Math.min(2, maxW / img.naturalWidth) || 1;
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height);
    for (let i = 0; i < d.data.length; i += 4) {
      const lum = 0.299 * d.data[i] + 0.587 * d.data[i + 1] + 0.114 * d.data[i + 2];
      const v = lum > 150 ? 255 : 0;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    }
    ctx.putImageData(d, 0, 0);
    const worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: whitelist || '0123456789 ',
      tessedit_pageseg_mode: '6'
    });
    try {
      const { data } = await worker.recognize(c);
      return data.text || '';
    } finally {
      await worker.terminate();
    }
  }

  // Photo fallback: works in browsers that block the live camera. Snap (or
  // pick) a picture of the label and decode the barcode from the still image.
  photoBtn.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', () => {
    const file = photoInput.files && photoInput.files[0];
    photoInput.value = '';
    if (!file) return;
    if (typeof ZXing === 'undefined') {
      statusEl.textContent = 'Scanner library failed to load — check your connection.';
      return;
    }
    statusEl.textContent = 'Reading photo…';
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      // 1) The barcode itself, from the full-resolution still - a still
      // photo carries far more detail than a live video frame. The pro
      // (zxing-cpp) decoder gets the first try, ZXing-JS the second.
      try {
        if (typeof ZXingWASM !== 'undefined') {
          await ZXingWASM.prepareZXingModule({
            overrides: { locateFile: (path) => path.endsWith('.wasm')
              ? 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm'
              : path },
            fireImmediately: true
          });
          const pc = document.createElement('canvas');
          const pw = Math.min(img.naturalWidth, 2000);
          pc.width = pw;
          pc.height = Math.round(img.naturalHeight * pw / img.naturalWidth);
          const pctx = pc.getContext('2d');
          pctx.drawImage(img, 0, 0, pc.width, pc.height);
          const pres = await ZXingWASM.readBarcodes(pctx.getImageData(0, 0, pc.width, pc.height), { maxNumberOfSymbols: 6, tryHarder: true });
          for (const r of pres) {
            if (handleRaw(r.text || '', r.format) === true) { URL.revokeObjectURL(url); return; }
          }
        }
      } catch (e) { /* fall through to ZXing-JS */ }
      try {
        const result = await makeReader().decodeFromImageElement(img);
        let fmtName = '';
        try { fmtName = String(result.getBarcodeFormat()); } catch (e) {}
        if (handleRaw(result.getText(), fmtName) === true) { URL.revokeObjectURL(url); return; }
      } catch (e) { /* fall through to reading the printed number */ }
      // 2) Read the printed tracking number under the barcode (OCR).
      if (typeof Tesseract === 'undefined') {
        statusEl.textContent = 'No barcode found in that photo. Fill the frame with the barcode, keep it flat and in good light, and try again.';
        URL.revokeObjectURL(url);
        return;
      }
      statusEl.textContent = 'No barcode read. Reading the printed number instead… (first time can take a few seconds)';
      try {
        const text = await ocrNumber(img);
        const found = extractTrackingFromText(text);
        if (found.goRes) { goResult(found.goRes); URL.revokeObjectURL(url); return; }
        if (!found.candidate) {
          // UPS numbers carry letters (1Z...), which the digits-only
          // pass cannot see - give the letters a turn before giving up.
          const text2 = await ocrNumber(img, '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ');
          const res2 = classify(text2);
          if (res2) { goResult(res2); URL.revokeObjectURL(url); return; }
        }
        if (found.candidate) {
          const numEl = document.getElementById('num');
          numEl.value = found.candidate;
          statusEl.textContent = 'I read a number like the one filled in below. Check it against the label, fix any wrong digit, then tap Track.';
          numEl.focus();
        } else {
          statusEl.textContent = 'Could not read that photo. Snap just the printed tracking number, filling the frame, flat and in good light.';
        }
      } catch (e) {
        statusEl.textContent = 'Could not read that photo. Try again, closer and in good light.';
      }
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      statusEl.textContent = 'Could not read that photo.';
    };
    img.src = url;
  });

  // Restart scanning if the page is restored from the back/forward cache
  window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
  start();
</script>
</body>
</html>
